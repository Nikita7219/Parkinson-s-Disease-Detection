<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet">
    <style>
        :root {
            --white-color: #fff;
            --primary-color: #3525D3;
            --light-gray: #E4E8EE;
            --black-color: #3C4A57;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .wrapper {
            padding: 50px 25px 0;
            max-width: 668px;
            width: 100%;
            margin: auto;
        }

        .wrapper .headline {
            text-align: center;
            padding-bottom: 48px;
        }

        .wrapper .headline h1 {
            font-size: 42px;
            font-weight: 700;
            line-height: 52px;
        }

        .wrapper .form {
            max-width: 350px;
            width: 100%;
            margin: auto;
        }

        .wrapper .form-group {
            margin-bottom: 15px;
        }

        .wrapper .form-group input {
            display: block;
            line-height: 24px;
            font-size: 16px;
            padding: 11px 15px;
            letter-spacing: -0.1px;
            border-radius: 5px;
            height: 48px;
            border: 1px solid #e4e8ee;
            color: var(--black-color);
            width: 100%;
            box-shadow: none;
        }

        .wrapper .form-group input:focus {
            outline: none;
        }

        .wrapper .form-group input::placeholder {
            color: var(--black-color);
            font-weight: 400;
            font-size: 14px;
        }

        .wrapper .btn {
            width: 100%;
            margin: 15px 0 30px;
            font-size: 14px;
            line-height: 22px;
            font-weight: 700;
            padding: 12px 29px;
            text-transform: uppercase;
            height: 48px;
            background-color: var(--primary-color);
            color: var(--white-color);
            border-radius: 2px;
            border: none;
            text-align: center;
            cursor: pointer;
        }

        .wrapper .btn:focus {
            outline: none;
        }

        .wrapper .account-exist {
            border-top: 1px solid var(--light-gray);
            color: var(--black-color);
            text-align: center;
            padding-top: 20px;
        }

        .wrapper .account-exist a {
            color: var(--primary-color);
        }

        .wrapper .forget-password {
            display: flex;
            align-items: center;
            padding: 15px 0;
            justify-content: space-between;
        }

        .wrapper .forget-password a {
            color: var(--primary-color);
        }

        .wrapper .forget-password .check-box {
            font-size: 15px;
            color: var(--black-color);
        }

        .signup.inActive {
            display: none;
        }

        .signin {
            display: none;
        }

        .signin.active {
            display: block;
        }

        @media (max-width:1030px) {
            .wrapper::before {
                left: -25%;
                min-height: 60vh;
                height: 500px;
            }
        }

        @media (max-width:767px) {
            .wrapper {
                max-width: 550px;
            }

            .wrapper .headline h1 {
                font-size: 22px;
                line-height: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="headline">
            <h1>Parkinson's Disease Detection</h1>
        </div>

        <form class="form" method="post" action="/add_user" id="signupForm">
            <div class="signup">
                <div class="form-group">
                    <input type="text" placeholder="Full name" required="" name="uname">
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email" required="" name="uemail">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password" required="" name="upassword">
                </div>
                <button type="submit" class="btn">SIGN UP</button>
                <div class="account-exist">
                    Already have an account? <a href="#" id="login">Login</a>
                </div>
            </div>
        </form>

        <form class="form" method="post" action="/login_validation" id="loginForm">
            <div class="signin">
                <div class="form-group">
                    <input type="email" placeholder="Email" required="" name="email">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password" required="" name="password">
                </div>
                <div class="forget-password">
                    <div class="check-box">
                        <input type="checkbox" id="checkbox">
                        <label for="checkbox">Remember me</label>
                    </div>
                </div>
                <button type="submit" class="btn">LOGIN</button>
                <div class="account-exist">
                    Create New a account? <a href="#" id="signup">Signup</a>
                </div>
            </div>
        </form>
    </div>


    <script>

        let btnLogin = document.getElementById("login");
        let btnSignUp = document.getElementById("signup");

        let signIn = document.querySelector(".signin");
        let signUp = document.querySelector(".signup");


        btnLogin.onclick = function () {
            signIn.classList.add("active");
            signUp.classList.add("inActive");
        }

        btnSignUp.onclick = function () {
            signIn.classList.remove("active");
            signUp.classList.remove("inActive");
        }

    </script>
</body>

</html>
